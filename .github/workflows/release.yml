# Builds the Windows app and publishes it as a GitHub release.
#   git tag v0.1.0 && git push origin v0.1.0
# The tag's number becomes the app version. Run by hand (Actions -> Release -> Run workflow) it only
# builds, and the files are attached to the run as an artifact instead of a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            migration-gateway/package-lock.json
            desktop/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix client
          npm ci --prefix migration-gateway
          npm ci --prefix desktop

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build installer and portable exe
        working-directory: desktop
        run: npm run dist

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: dbf inspector ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            desktop/out/*.exe

      - name: Keep the build (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: dbf-inspector-windows
          path: desktop/out/*.exe
